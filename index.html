// ---------- Audio ----------
let AC=null,soundOn=false,musicTimer=null,noiseBuf=null;
function beep(f,d,type,g,slide){if(!AC||!soundOn)return;const o=AC.createOscillator(),gn=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,AC.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),AC.currentTime+d);gn.gain.setValueAtTime(g||0.05,AC.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);o.connect(gn).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
function noise(dur,g){if(!AC||!soundOn)return;if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*0.3,AC.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
  const src=AC.createBufferSource();src.buffer=noiseBuf;const gn=AC.createGain();gn.gain.setValueAtTime(g,AC.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=900;src.connect(f).connect(gn).connect(AC.destination);src.start();src.stop(AC.currentTime+dur)}
function sHit(){beep(190,0.05,'square',0.03,120)}
function sPop(){beep(300,0.12,'square',0.045,70);noise(0.16,0.10);beep(150,0.22,'sine',0.10,38)}
function sTick(){beep(880,0.07,'square',0.045)}
function sGo(){beep(660,0.1,'square',0.06);setTimeout(()=>beep(990,0.18,'square',0.07),90)}
function sSting(){[392,523,659].forEach((f,i)=>setTimeout(()=>beep(f,0.14,'triangle',0.07),i*70))}
function sWin(){[523,659,784,1046,1318,1568].forEach((f,i)=>setTimeout(()=>beep(f,0.24,'triangle',0.08),i*110))}
function speak(txt){
  if(!soundOn)return;
  try{
    if(!('speechSynthesis' in window))return;
    if(speechSynthesis.speaking&&speechSynthesis.pending)return; // never build a backlog
    const u=new SpeechSynthesisUtterance(txt);
    u.rate=1.35;u.pitch=0.95;u.volume=1;
    const vs=speechSynthesis.getVoices();
    const en=vs.find(v=>v.lang&&v.lang.toLowerCase().indexOf('en')===0);
    if(en)u.voice=en;
    speechSynthesis.speak(u);
  }catch(e){}
}

const discs={};
function makeDisc(code){
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');c.width=40;c.height=40;
    const g=c.getContext('2d');
    g.beginPath();g.arc(20,20,18.5,0,7);g.clip();
    const sc=Math.max(40/img.width,40/img.height);
    g.drawImage(img,20-img.width*sc/2,20-img.height*sc/2,img.width*sc,img.height*sc);
    const gl=g.createRadialGradient(13,11,2,20,20,26);
    gl.addColorStop(0,"rgba(255,255,255,0.38)");gl.addColorStop(0.45,"rgba(255,255,255,0.05)");gl.addColorStop(0.8,"rgba(0,0,0,0.10)");gl.addColorStop(1,"rgba(0,0,0,0.34)");
    g.fillStyle=gl;g.fillRect(0,0,40,40);
    discs[code]=c;
  };
  img.src=FLAGDATA.imgs[code];
}
FLAGDATA.countries.forEach(([n,code])=>makeDisc(code));

    if(roundMod.badge){ctx.font="bold 15.5px Arial";ctx.fillStyle=roundMod.color;
      ctx.fillText(roundMod.badge,W/2,AY+AH/2+176)}
    if(lastResultTxt){ctx.font="13.5px Arial";ctx.fillStyle="#9fb6dd";
      ctx.fillText(lastResultTxt,W/2,AY+32)}
    ctx.fillStyle="rgba(255,255,255,0.2)";ctx.fillRect(AX+60,AY+AH/2+142,AW-120,10);
    ctx.fillStyle="#ffd54f";ctx.fillRect(AX+60,AY+AH/2+142,(AW-120)*(predictT/10),10);
    ctx.textAlign="left";
  }
  // countdown overlay
  if(phase==="cd"){
    const seg=cdT>1.2?"3":cdT>0.6?"2":"1";
    const local=1-((cdT%0.6)/0.6);
    ctx.save();ctx.translate(W/2,AY+AH/2);ctx.scale(0.7+local*0.5,0.7+local*0.5);
    ctx.globalAlpha=Math.min(1,local*2.2);
    ctx.fillStyle="#ffd54f";ctx.font="bold 110px Arial";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.shadowBlur=30;ctx.shadowColor="#ff9800";
    ctx.fillText(seg,0,0);ctx.restore();
    ctx.globalAlpha=1;ctx.textBaseline="alphabetic";ctx.textAlign="left";
  }
  // confetti + result overlay
  if(phase==="result"&&winTeam){
    ctx.fillStyle="rgba(3,6,18,0.52)";ctx.fillRect(0,0,W,H);
    confetti.forEach(c=>{ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot);ctx.fillStyle=c.c;ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);ctx.restore()});
    ctx.textAlign="center";
    ctx.fillStyle=TEAMCOL[winTeam];ctx.font="bold 46px Arial";ctx.shadowBlur=20;ctx.shadowColor=TEAMCOL[winTeam];
    ctx.fillText(winTeam==="RED"?"🔴 RED WINS!":"🔵 BLUE WINS!",W/2,300);ctx.shadowBlur=0;
    if(champion){
      const disc=discs[champion.code];
      ctx.save();ctx.translate(W/2,374);
      ctx.strokeStyle="#ffd54f";ctx.lineWidth=3;ctx.setLineDash([8,6]);ctx.lineDashOffset=-frame*0.7;
      ctx.beginPath();ctx.arc(0,0,52,0,7);ctx.stroke();ctx.setLineDash([]);
      if(disc)ctx.drawImage(disc,-40,-40,80,80);
      ctx.restore();
      ctx.fillStyle="#ffd54f";ctx.font="bold 21px Arial";
      ctx.fillText("👑 MVP: "+champion.name+" — "+champion.kills+" knockouts!",W/2,468);
      ctx.font="bold 15.5px Arial";ctx.fillStyle="#ffe082";
      ctx.fillText("🏆 "+champion.name+" career wins: "+(careerWins[champion.name]||0),W/2,494);
      const tops=Object.entries(careerWins).sort((a,b)=>b[1]-a[1]).slice(0,3);
      if(tops.length){ctx.font="13.5px Arial";ctx.fillStyle="#9fb6dd";
        ctx.fillText("Top champions: "+tops.map(t=>t[0]+" ("+t[1]+")").join("  •  "),W/2,650);}
    }
    ctx.fillStyle="#fff";ctx.font="bold 20px Arial";
    ctx.fillText(winTeam==="RED"?"Comment if YOU picked RED!":"Comment if YOU picked BLUE!",W/2,516);
    ctx.font="17px Arial";ctx.fillStyle="#cfe6ff";
    ctx.fillText("Next battle is coming up...",W/2,552);
    {const nm=MODS[roundNo%MODS.length];
     ctx.font="bold 15.5px Arial";ctx.fillStyle=nm.id==="NORMAL"?"#9fb6dd":nm.color;
     ctx.fillText(nm.id==="NORMAL"?"Next round: a classic battle!":"Next round: "+nm.badge,W/2,616);}
    ctx.fillText("Comment RED or BLUE now to predict!",W/2,580);
    ctx.textAlign="left";
  }
  // bottom bar
  ctx.fillStyle="rgba(13,23,64,0.95)";ctx.fillRect(0,AY+AH+10,W,H-(AY+AH+10));
  ctx.fillStyle="#fff";ctx.font="bold 15.5px Arial";ctx.textAlign="center";
  ctx.fillText(commentary,W/2,AY+AH+42);
  ctx.fillStyle="#ffd54f";ctx.font="bold 13.5px Arial";
  ctx.fillText("Comment 🔴 RED or 🔵 BLUE before the battle starts!",W/2,AY+AH+68);
  ctx.textAlign="left";
  ctx.restore();
  // idle overlay
  if(phase==="idle"){
    ctx.fillStyle="rgba(3,6,18,0.85)";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#ffd54f";ctx.font="bold 38px Arial";ctx.textAlign="center";ctx.fillText("⚔️ PREDICTION BATTLE",W/2,320);
    ctx.fillStyle="#fff";ctx.font="19px Arial";
    ctx.fillText("50 flags 🔴 RED vs 50 flags 🔵 BLUE.",W/2,372);
    ctx.fillText("Viewers comment their prediction,",W/2,400);
    ctx.fillText("then the teams fight to the last flag!",W/2,428);
    ctx.fillStyle="#4fc3f7";ctx.font="bold 19px Arial";ctx.fillText("Press START GAME below",W/2,486);
    ctx.textAlign="left";
  }
}
// ---------- Main loop & controls ----------
let lastT=performance.now(),fpsAvg=16;
function loop(now){
  const dtms=now-lastT;lastT=now;fpsAvg=fpsAvg*0.95+dtms*0.05;
  let dt=Math.min(0.033,dtms/1000);
  if(slowT>0){slowT-=dt;dt*=0.35}
  shake*=0.88;if(shake<0.05)shake=0;
  update(dt);render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
function doStart(){
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)()}
  if(AC.state==="suspended")AC.resume();
  teamWins={RED:0,BLUE:0};startRound();startMusic();
}
document.getElementById('btnStart').addEventListener('click',doStart);
document.getElementById('btnSound').addEventListener('click',function(){
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)()}
  soundOn=!soundOn;this.textContent=soundOn?"🔊 SOUND: ON":"🔊 SOUND: OFF";
  if(soundOn)startMusic();
});
cv.addEventListener('click',()=>{if(phase==="idle")doStart()});
const QP=new URLSearchParams(location.search);
if(QP.has('snd')){soundOn=true;document.getElementById('btnSound').textContent="🔊 SOUND: ON"}
if(QP.has('auto')){doStart();
  let tries=0;const iv=setInterval(()=>{if(AC&&AC.state==='suspended')AC.resume();if(++tries>24||(AC&&AC.state==='running'))clearInterval(iv)},500);}
</script>
